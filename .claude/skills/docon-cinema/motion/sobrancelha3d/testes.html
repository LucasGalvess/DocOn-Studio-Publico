  renderAt = (t) => {
    card('Colágeno', 'Degradação do <em>colágeno</em>', 'A pele perde firmeza e sustentação.'); showCard(t, 0.3, DUR);
    const sag = ss(1.8, 5.2, t); deform(epi, sag, TOP - 0.2); deform(der, sag, TOP - 2.5);
