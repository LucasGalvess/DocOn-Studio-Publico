<!doctype html>
<html lang="pt-BR" data-resolution="portrait"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap.min.js"></script><link rel="stylesheet" href="assets/base.css"><style>/*{{CSS}}*/
#box { position: absolute; left: 70px; right: 70px; top: calc(var(--y, 50) * 1%); padding: 40px 48px; border-radius: 34px; background: color-mix(in srgb, var(--glass) 66%, transparent); }
#k { display: inline-block; padding: 8px 18px; border-radius: 99px; background: var(--destaque); color: var(--glass); font: 800 26px/1 var(--f-titulo); letter-spacing: .06em; text-transform: uppercase; }
.it { display: flex; gap: 22px; align-items: center; margin-top: 26px; font: 700 44px/1.2 var(--f-texto); color: var(--texto); }
.ck { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--acento); display: grid; place-items: center; }
.ck svg { width: 30px; height: 30px; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
  <div id="box" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0"><span id="k">{{kicker}}</span><div id="its"></div></div>
</div>
<script>
const D = {{DUR}}, ITENS = {{itens_json}} || [];
document.getElementById('its').innerHTML = ITENS.map((t) => `<div class="it"><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--acento)"/></svg></span><span>${t}</span></div>`).join('');
const tl = gsap.timeline({ paused: true });
tl.fromTo('#box', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, 0);
tl.fromTo('#k', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power4.out' }, 0.12);
tl.fromTo('.it', { opacity: 0, x: -24, filter: 'blur(4px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.4, ease: 'expo.out', stagger: Math.min(0.45, (D * 0.5) / Math.max(1, ITENS.length)) }, 0.3);
tl.fromTo('.ck', { scale: 0 }, { scale: 1, duration: 0.45, ease: 'back.out(2)', stagger: Math.min(0.45, (D * 0.5) / Math.max(1, ITENS.length)) }, 0.38);
tl.to('#box', { opacity: 0, y: -16, duration: 0.3, ease: 'power3.in' }, D - 0.32);
window.__timelines['main'] = tl; tl.seek(0);
</script></body></html>
