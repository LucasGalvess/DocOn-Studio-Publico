  const mat = new THREE.PointsMaterial({map: GLOW, size, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xf6deac}); const pts = new THREE.Points(geo, mat); pts.renderOrder = 5;
  mat.depthTest = SC !== 3; seed = 5; const seeds = Array.from({length: n}, () => [rnd(), rnd(), rnd(), rnd()]); return {pts, P, geo, mat, seeds}; }

  const nd = new THREE.Mesh(new THREE.CylinderGeometry(.0035, .0035, .36, 10), m); nd.position.y = .18; g.add(nd);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.02, .014, .07, 20), new THREE.MeshStandardMaterial({color: 0xf2d6a6, roughness: .3})); hub.position.y = .39; g.add(hub);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, .34, 28), new THREE.MeshPhysicalMaterial({color: 0xffffff, roughness: .05, transparent: true, opacity: .3, clearcoat: 1})); body.position.y = .6; g.add(body);
  const liq = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .2, 24), new THREE.MeshBasicMaterial({color: 0xf6deac, transparent: true, opacity: .55})); liq.position.y = .53; g.add(liq);
  return g; }
function halo() { const h = new THREE.Sprite(new THREE.SpriteMaterial({map: GLOW, color: 0xf6deac, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending})); h.renderOrder = 6; return h; }

/* =================== cenas =================== */
const Fc = faceModel(SC === 3 ? .38 : .95); scene.add(Fc.g); let FR = null, LV = null; const S = {};
if ([4, 5, 6].includes(SC)) FR = frontalis(Fc);
const arrow = (x, y) => { const a = new THREE.Group(); const m = new THREE.MeshBasicMaterial({color: 0xf6deac, transparent: true, opacity: 0, depthTest: false}); const sh = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, 1, 8), m); sh.geometry.translate(0, .5, 0); const hd = new THREE.Mesh(new THREE.ConeGeometry(.02, .045, 16), m); a.add(sh, hd); a.renderOrder = 10; a.position.copy(FP(Fc, x, y, .05)); Fc.g.add(a); return {a, sh, hd, m}; };
const setArrow = (o, L, op) => { o.sh.scale.y = Math.max(.001, L); o.hd.position.y = L + .02; o.m.opacity = op; };
if (SC === 1) {
  rotulo('<span class="kick">Depois da toxina</span><div class="tit">A pálpebra pode <b>descer</b></div><div class="sub">e o olhar fica pesado</div>', 50, 150, .3, DUR + 1);
  S.t1 = tag('olhar normal', .9, DUR + 1, -58, 30); S.t2 = tag('pálpebra caída', 2.7, DUR + 1, -62, 30);
}
if (SC === 2) rotulo('<span class="kick">Terço superior</span><div class="tit">Testa, sobrancelhas e pálpebras</div>', 40, 700, .5, DUR + 1);
if (SC === 3) {
  LV = levator(Fc, 'e'); Fc.eyes.d.ball.visible = Fc.eyes.d.iris.visible = false;
  S.nd = needle(); Fc.g.add(S.nd); S.tox = particles(420, .014); Fc.g.add(S.tox.pts);

  rotulo('<span class="kick">Ptose palpebral</span><div class="tit">A toxina pode <b>chegar até ele</b></div>', 50, 150, 2.6, 4.7);
  rotulo('<span class="kick">Ptose palpebral</span><div class="tit">A pálpebra <b>desce</b></div><div class="sub">Um efeito temporário</div>', 50, 150, 4.7, DUR + 1);

if (SC === 4) { rotulo('<span class="kick">Músculo frontal</span><div class="tit">Eleva as sobrancelhas</div><div class="sub">e ajuda a abrir o olhar</div>', 40, 700, .5, DUR + 1);

if (SC === 5) { S.tox = particles(520, .026); Fc.g.add(S.tox.pts);
  S.pts = [[-.33, .34], [-.17, .31], [0, .42], [.17, .32], [.33, .36], [-.27, .262], [.27, .29], [-.1, .46], [.1, .46], [0, .31]];
  S.halos = S.pts.map(([x, y]) => { const h = halo(); h.position.copy(FP(Fc, x, y, .025)); Fc.g.add(h); return h; });
  rotulo('<span class="kick">Aplicação inadequada</span><div class="tit">Dose alta ou <b>pontos errados</b></div>', 50, 150, .2, 3.7);
  rotulo('<span class="kick">Resultado</span><div class="tit">Sobrancelha e pálpebra <b>descem</b></div><div class="sub">O olhar fica mais caído</div>', 50, 150, 3.7, DUR + 1); }
if (SC === 6) { rotulo('<span class="kick">Avaliação</span><div class="tit">Contração, força e assimetrias</div>', 40, 700, .5, DUR + 1);
  S.arrows = [arrow(-.26, .4), arrow(.26, .42)];

/* =================== animação =================== */
window.renderAt = (t) => {
  const st = {}; let act = 0, actD = 0, actE = 0, dim = 0;
  if (SC === 1) { Fc.g.rotation.y = .05 * Math.sin(t * .5); cam.position.set(0, .12, 2.15 - .15 * eio(t / DUR)); cam.lookAt(0, .1, 0);
    st.lidE = .85 * eio((t - 1.7) / 2.0); }
  if (SC === 2) { Fc.g.rotation.y = lerp(-.55, -.15, eio(t / DUR)); cam.position.set(0, .02, 3.25); cam.lookAt(-.36, -.02, 0);
    Fc.holo.uniforms.uBand.value.set(.19, .62, eio((t - .8) / 1.2)); }
  if (SC === 3) { const c = Fc.eyes.e.c; const a = lerp(1.15, .9, eio(t / DUR)); cam.position.set(c.x + Math.sin(a) * 1.45, c.y + .08, c.z + Math.cos(a) * 1.45); cam.lookAt(c.x - .04, c.y + .03, c.z - .08);
    const pulse = t < 2.6 ? .5 + .5 * Math.sin(t / 1.3 * Math.PI - Math.PI / 2) : 0; dim = eio((t - 3.3) / 1.4);
    st.lidE = t < 2.6 ? -.25 * pulse : .9 * eio((t - 4.6) / 1.5);
    LV.m.uniforms.uAct.value = pulse; LV.m.uniforms.uDim.value = dim; LV.m.uniforms.uT.value = t;
    const tip = FP(Fc, .24, .29, 0); const nIn = eio((t - 2.5) / .6), nOut = eio((t - 4.1) / .5);
    S.nd.position.copy(tip).add(new THREE.Vector3(.02, .03, .04).multiplyScalar(1 + 4 * (1 - nIn) + 5 * nOut)); S.nd.rotation.set(.6, 0, -.35); S.nd.visible = t > 2.3 && t < 4.7;
    const tp = S.tox; for (let i = 0; i < tp.seeds.length; i++) { const [a1, b, cc, d] = tp.seeds[i]; const age = Math.max(0, t - (3.0 + a1 * 1.1)); const k = 1 - Math.exp(-age * 1.5);
      const dest = c.clone().add(new THREE.Vector3((b - .5) * 16 * MM, 13 * MM + (cc - .5) * 5 * MM, -(4 + d * 18) * MM)); const p = tip.clone().lerp(dest, k * (.35 + .65 * cc)); tp.P.set([p.x, p.y, p.z], i * 3); }
    tp.geo.attributes.position.needsUpdate = true; tp.mat.opacity = cl((t - 3.0) / .3) * (1 - .5 * eio((t - 5.3) / 1.4));
    S.tg.p = c.clone().add(new THREE.Vector3(0, 15 * MM, -22 * MM)).applyMatrix4(Fc.g.matrixWorld); }
  if (SC === 4) { Fc.g.rotation.y = lerp(.3, .08, eio(t / DUR)); cam.position.set(0, .08, 3.25); cam.lookAt(-.36, .06, 0);
    const c = t > .9 && t < DUR - .4 ? Math.max(0, Math.sin((t - .9) / 2.7 * Math.PI)) : 0; act = actD = actE = c; st.browD = st.browE = .035 * c; st.lidD = st.lidE = -.3 * c;
    S.arrows.forEach((o) => setArrow(o, .1 * c, cl(c * 3))); }
  if (SC === 5) { Fc.g.rotation.y = lerp(-.15, .1, eio(t / DUR)); cam.position.set(0, .3, 1.95 - .15 * eio(t / DUR)); cam.lookAt(0, .27, 0);
    dim = eio((t - 2.2) / 2.0); st.browD = st.browE = -.03 * eio((t - 3.5) / 2.0); st.lidD = st.lidE = .7 * eio((t - 3.7) / 2.0);
    S.halos.forEach((h, i) => { const b = .3 + i * .2; const k = eo((t - b) / 1.4); h.material.opacity = cl((t - b) / .2) * (.8 - .45 * k) * (1 - .6 * eio((t - 5.4) / 1.5)); h.scale.setScalar(.025 + .16 * k); });
    const tp = S.tox; for (let i = 0; i < tp.seeds.length; i++) { const [a1, b, c, d] = tp.seeds[i]; const k = Math.floor(a1 * S.pts.length); const [x0, y0] = S.pts[k]; const age = Math.max(0, t - (.3 + k * .2));
      const sp = (1 - Math.exp(-age * 1.2)) * (.02 + .07 * c); const th = b * 6.283; const p = FP(Fc, x0 + Math.cos(th) * sp, y0 + Math.sin(th) * sp - .018 * age * d, .022); tp.P.set([p.x, p.y, p.z], i * 3); }
    tp.geo.attributes.position.needsUpdate = true; tp.mat.opacity = cl((t - .3) / .3) * (1 - .45 * eio((t - 5) / 2)); }
  if (SC === 6) { Fc.g.rotation.y = lerp(-.08, .08, eio(t / DUR)); cam.position.set(0, .06, 3.3); cam.lookAt(-.36, .04, 0);
    Fc.holo.uniforms.uScan.value = t < 3.2 ? lerp(.55, -.75, eio((t - .4) / 2.6)) : -9;
    const c = (t > 3.4 ? Math.max(0, Math.sin((t - 3.4) / 2.6 * Math.PI)) : 0) + (t > 6.2 && t < 8.8 ? Math.max(0, Math.sin((t - 6.2) / 2.6 * Math.PI)) : 0);
    actD = c; actE = .5 * c; act = c; st.browD = .036 * c; st.browE = .016 * c; st.lidD = -.3 * c; st.lidE = -.12 * c;
    setArrow(S.arrows[0], .13 * c, cl(c * 3)); setArrow(S.arrows[1], .05 * c, cl(c * 3));
    S.tL.p = FP(Fc, -.26, .52, .05).applyMatrix4(Fc.g.matrixWorld); S.tR.p = FP(Fc, .26, .5, .05).applyMatrix4(Fc.g.matrixWorld); }
  Fc.set(st); if (FR) { FR.refresh(); FR.set(act, dim, t, actD, actE); } if (LV) LV.refresh();
  if (SC === 1) { S.t1.p = FP(Fc, -.22, -.02, .03).applyMatrix4(Fc.g.matrixWorld); S.t2.p = FP(Fc, .22, .02, .03).applyMatrix4(Fc.g.matrixWorld); }
  scene.updateMatrixWorld(true); R.render(scene, cam); txt(t);
  if (PANEL) { const ease = (x) => { x = cl(x); return x * x * (3 - 2 * x); }; const TR = .55; const a = eo(t / TR) * (1 - ease((t - (DUR - TR)) / TR));   // mesmo ritmo da divisão no pipeline
    const y = (1 - a) * 640; for (const el of [document.getElementById('card'), R.domElement, document.getElementById('labs')]) el.style.transform = `translateY(${y.toFixed(1)}px)`; }
  return true;
};
await document.fonts.ready; window.pronto = true;
