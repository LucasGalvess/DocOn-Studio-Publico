<title>DocOn · Pré-visualização</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Página do cliente: só o vídeo e a decisão. Mesmo visual escuro do DocOn Studio (sala de edição), com a barra de
   Aprovar / Pedir alteração sempre visível embaixo, durante todo o vídeo. */
:root{
  --bg:#141110; --panel:#1C1816; --raised:#25201D; --line:#342D29; --fg:#EFE8DF; --muted:#A09489; --faint:#6E645C;
  --accent:#D9A08F; --accent-ink:#2A1714; --ok:#8CCFA9; --warn:#E8B86A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141110;--panel:#1C1816;--fg:#EFE8DF}}
:root[data-theme="dark"]{--bg:#141110;--panel:#1C1816;--fg:#EFE8DF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#241d1a 0%,var(--bg) 65%) fixed,var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:rgba(28,24,22,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.brand{font:800 18px var(--display);display:flex;align-items:center;gap:8px;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:420px){.brand small{display:none}}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(217,160,143,.18)}
.brand small{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.08em}
.top .sp{flex:1}
.chip{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.wa{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
main{max-width:520px;margin:0 auto;text-align:left;padding:20px max(16px,env(safe-area-inset-right,0px)) 140px;display:grid;gap:16px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:800 24px/1.15 var(--display);margin:4px 0 0;text-wrap:balance}
.stage{position:relative;width:min(100%,420px,calc((100svh - 300px) * 9 / 16));min-width:min(100%,240px);justify-self:center;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#0d0b0a;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px var(--line)}
.stage video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 55%,rgba(0,0,0,.45));border:0;cursor:pointer;padding:0}
.play span{width:76px;height:76px;border-radius:50%;background:rgba(20,17,16,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
.play svg{width:30px;height:30px;margin-left:5px;fill:#fff}
.note{color:var(--muted);font-size:13.5px;margin:0;text-align:center}
.state{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.state b{font:700 16px var(--display)}
.state p{margin:0;color:var(--muted);font-size:14px}
.state.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
/* barra fixa de decisão */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(20,17,16,.92) 30%);}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:10px;background:rgba(28,24,22,.9);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:10px}
.btn{border-radius:11px;padding:14px 12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--raised);cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.dl .btn{padding:9px 12px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,8,7,.72);display:grid;place-items:end center;z-index:10;padding:16px}
@media (min-width:640px){.modal{place-items:center}}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(520px,100%);padding:18px;display:grid;gap:12px}
.dlg h2{margin:0;font:800 19px var(--display)}
.dlg textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:120px;resize:vertical;width:100%}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.hint{font-size:12.5px;color:var(--faint);margin:0}
#status{min-height:1.3em}
</style>

<header class="top"><div class="brand"><i></i>DocOn Studio <small>PRÉ-VISUALIZAÇÃO</small></div><span class="sp"></span><span class="chip" id="chip">Carregando…</span></header>
<main>
  <div style="text-align:center"><p class="eyebrow" id="who"></p><h1 id="ttl">Pré-visualização</h1></div>
  <div class="stage"><video id="v" playsinline preload="metadata"></video><button class="play" id="pl" type="button" aria-label="Reproduzir o vídeo"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></span></button></div>
  <p class="note" id="note">Assista ao vídeo e use os botões abaixo para aprovar ou pedir uma alteração.</p>
  <div class="state" id="state" hidden></div>
  <p class="hint" id="status" role="status"></p>
</main>
<div class="bar" id="bar"><div class="in"><button class="btn" id="alt" type="button">Pedir alteração</button><button class="btn pri" id="ok" type="button">Aprovar</button></div></div>
<div id="modalRoot"></div>
<script type="application/json" id="dados">{}</script>

<script>
/* Funciona em dois lugares:
   - no site próprio da DocOn: window.DOCON_APROV = {token, ver} e a aprovação mora no banco do site (aprovacoes/<token>);
   - como página do claude.ai publicada pela sessão: os dados vêm em #dados e a decisão fica no banco desta página
     (decisoes/<token>) e, quando possível, segue como comentário para a sessão do Claude, que atualiza o Studio. */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SITE = window.DOCON_APROV || null;
let D = {}; try { D = JSON.parse($('dados').textContent || '{}'); } catch (e) {}
const VER = !!(SITE ? SITE.ver : D.ver);              // link "só assistir": sem botões
const TK = SITE ? SITE.token : D.token;
let A = null, db = null, dl = null, comments = null, me = null;
const say = (t) => $('status').textContent = t;

function render() {
  if (!A) return;
  $('who').textContent = [A.profissional, A.rotulo].filter(Boolean).join(' · ');
  $('ttl').textContent = A.projeto_titulo || A.titulo || 'Pré-visualização';
  if ($('v').getAttribute('src') !== A.video) $('v').src = A.video;
  const st = A.status || 'aguardando';
  const chip = $('chip'); chip.className = 'chip ' + (st === 'aprovado' ? 'ok' : st === 'aguardando' ? '' : 'wa');
  chip.textContent = VER ? 'Só visualização' : st === 'aprovado' ? 'Aprovado' : st === 'aguardando' ? 'Aguardando sua aprovação' : 'Alteração em andamento';
  const box = $('state'); box.hidden = VER || st === 'aguardando'; box.className = 'state' + (st === 'aprovado' ? ' ok' : '');
  if (st === 'aprovado') box.innerHTML = `<b>Vídeo aprovado</b><p>Obrigado! A equipe foi avisada e finaliza o vídeo para publicação.</p>`;
  else if (st !== 'aguardando') box.innerHTML = `<b>Alteração recebida</b><p>“${esc(A.pedido || '')}”</p><p>A equipe está ajustando e confere tudo antes de enviar a nova versão neste mesmo link.</p>`;
  box.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => baixar());
  $('bar').hidden = VER || st !== 'aguardando';
  $('note').textContent = VER ? 'Vídeo para visualização.' : st === 'aguardando' ? 'Assista ao vídeo e use os botões abaixo para aprovar ou pedir uma alteração.' : '';
}
async function baixar() {
  try { say('Preparando o arquivo…'); const blob = await (await fetch(A.video)).blob(); const nome = (A.projeto_titulo || 'video').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_') + '.mp4';
    if (dl) { await dl.save({filename: nome, data: blob}); } else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); }
    say('Download iniciado.'); }
  catch (e) { say(e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível baixar aqui.'); }
}
async function decidir(status, pedido) {
  const ev = {t: Date.now(), tipo: status === 'aprovado' ? 'aprovado' : 'alteração pedida', texto: pedido || ''};
  if (SITE) {
    const r = await fetch('/api/db/doc?path=' + encodeURIComponent('aprovacoes/' + TK), {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status, ...(pedido ? {pedido} : {}), atualizado: Date.now(), eventos: [...(A.eventos || []), ev]})});
    if (!r.ok) throw {code: 'write'};
  } else {
    if (!db) throw {code: 'write'};
    await db.doc('decisoes/' + TK).set({status, pedido: pedido || '', quando: Date.now(), por: me || ''});
    if (comments) { try { const can = await comments.canSendToClaude(); if (can === 'available') { const anchor = await comments.anchorFor($('state')); await comments.sendToClaude({anchor, text: `[DocOn Aprovação · ${TK}] ${status === 'aprovado' ? 'APROVADO' : 'ALTERAÇÃO'}${pedido ? ': ' + pedido : ''}`}); } } catch (e) {} }
  }
  A = {...A, status, pedido: pedido || A.pedido}; render();
}
$('ok').onclick = async () => {
  $('ok').disabled = true;
  try { await decidir('aprovado'); say('Aprovado! A equipe foi avisada.'); }
  catch (e) { say('Não consegui registrar a aprovação: peça à equipe acesso para interagir com esta página.'); }
  finally { $('ok').disabled = false; }
};
$('alt').onclick = () => {
  $('modalRoot').innerHTML = `<div class="modal" id="mdl"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mT"><h2 id="mT">O que você gostaria de alterar?</h2>
    <textarea id="txt" aria-label="Descreva a alteração" placeholder="Ex.: aos 12 segundos, trocar o texto do cartão final para “Agende pelo link da bio”."></textarea>
    <p class="hint">Dica: diga o momento do vídeo (“aos 12 segundos…”) e o que muda.</p>
    <div class="row"><button class="btn" type="button" id="cx">Cancelar</button><button class="btn pri" type="button" id="go">Enviar alteração</button></div><p class="hint" id="mst"></p></div></div>`;
  $('txt').focus();
  $('cx').onclick = () => $('modalRoot').innerHTML = '';
  $('mdl').onclick = (e) => { if (e.target.id === 'mdl') $('modalRoot').innerHTML = ''; };
  $('go').onclick = async () => { const t = $('txt').value.trim(); if (!t) { $('mst').textContent = 'Descreva a alteração.'; return; } $('go').disabled = true;
    try { await decidir('alteracao', t.slice(0, 2000)); $('modalRoot').innerHTML = ''; say('Alteração enviada para a equipe.'); }
    catch (e) { $('mst').textContent = 'Não consegui enviar: peça à equipe acesso para interagir com esta página.'; $('go').disabled = false; } };
};
const v = $('v');
$('pl').onclick = () => { v.controls = true; v.play().catch(() => {}); $('pl').hidden = true; };
v.addEventListener('pause', () => { if (v.ended) { $('pl').hidden = false; v.controls = false; } });

(async () => {
  if (SITE) {
    const load = async () => { const r = await fetch('/api/db/doc?path=' + encodeURIComponent('aprovacoes/' + TK)); const j = r.ok ? await r.json() : null;
      if (!j || !j.exists) { $('ttl').textContent = 'Link não encontrado'; $('chip').textContent = 'Indisponível'; $('bar').hidden = true; return; }
      A = {...j.data, video: '/_blob/' + j.data.asset_id}; render(); };
    await load(); setInterval(() => { if (!document.hidden) load(); }, 15000); return;
  }
  A = {status: 'aguardando', ...D}; render();
  try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
  try { comments = await window.claude?.use?.('comments'); } catch (e) {}
  try { const u = await window.claude?.use?.('user'); if (u) me = await u.id(); } catch (e) {}
  try { db = await window.claude?.use?.('db'); } catch (e) {}
  if (db) db.doc('decisoes/' + TK).onSnapshot((d) => { if (d.exists) { const x = d.data(); A = {...A, status: x.status, pedido: x.pedido}; render(); } }, () => {});
})();
</script>
